<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票資訊儀表板</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--up:#e5484d;--dn:#2fa36b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1a1d22;--tx:#e8eaed;--mu:#9aa0a8;--bd:#2c3037;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#101215;--card:#1a1d22;--tx:#e8eaed;--mu:#9aa0a8;--bd:#2c3037;--ac:#6ea0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;z-index:5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:17px;margin:0 8px 0 0}
button,input{font:inherit;color:var(--tx)}
.chip{border:1px solid var(--bd);background:var(--card);padding:4px 11px;border-radius:16px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:5px 9px;flex:1;min-width:120px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px}
.note{margin:8px 12px;padding:8px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--bd);color:var(--mu);font-size:12px}
main{padding:0 12px 40px;max-width:980px;margin:auto}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:12px 0;overflow:hidden}
.sec h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:430px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500;font-size:12px}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.tag{font-size:11px;padding:0 6px;border-radius:8px;background:var(--bg);color:var(--mu);margin-left:4px}
.star{cursor:pointer;color:var(--mu);margin-right:4px}.star.on{color:#f5a623}
.up{color:var(--up)}.dn{color:var(--dn)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;overflow:auto}
#md{background:var(--card);max-width:860px;margin:env(safe-area-inset-top,0px) auto 0;min-height:100%;padding:12px}
canvas{width:100%;height:340px;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px}.kv b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.news{padding:8px 0;border-bottom:1px solid var(--bd)}.news small{color:var(--mu)}
</style></head><body>
<header>
 <div class="row"><h1>📈 股票資訊</h1>
  <button class="chip on" id="mTW">台股</button><button class="chip" id="mUS">美股</button>
  <input id="q" placeholder="搜尋代號 / 名稱">
  <button class="chip on" id="live">● 即時更新</button></div>
 <div class="scroll" id="inds"></div>
</header>
<div class="note" id="note">⚠️ 目前為<b>示範模擬資料</b>（價格、量、新聞皆為程式產生，非真實行情）。已設計好資料結構，之後可把 <code>loadQuotes()</code> 換成真實 API 即可上線。</div>
<main id="main"></main>
<div id="ov"><div id="md"></div></div>
<script>
const RAW={TW:{

"生技醫療":{"新藥":"4743 合一,6446 藥華藥,4162 智擎,6547 高端疫苗","醫材":"1795 美時,4126 太醫,4736 泰博,4104 佳醫"},
"傳產":{"鋼鐵":"2002 中鋼,2014 中鴻,2027 大成鋼,2006 東和鋼鐵","塑化":"1301 台塑,1303 南亞,1326 台化,6505 台塑化","食品":"1216 統一,1227 佳格,1210 大成"},
"運輸":{"航運":"2603 長榮,2609 陽明,2615 萬海","航空":"2610 華航,2618 長榮航,2646 星宇航空"},
"百貨零售":{"百貨":"2903 遠百,5904 寶雅,2912 統一超,8454 富邦媒"},
"金融":{"金控":"2881 富邦金,2882 國泰金,2891 中信金,2886 兆豐金,2884 玉山金"}},
US:{
"科技":{"AI 晶片":"NVDA NVIDIA,AMD AMD,AVGO Broadcom,MRVL Marvell,ARM Arm","雲端軟體":"MSFT Microsoft,CRM Salesforce,NOW ServiceNow,SNOW Snowflake,ORCL Oracle","半導體設備":"ASML ASML,AMAT Applied Materials,LRCX Lam Research,KLAC KLA","記憶體":"MU Micron,WDC Western Digital,STX Seagate","伺服器散熱":"SMCI Super Micro,DELL Dell,VRT Vertiv,HPE HPE"},
"生技醫療":{"大型藥廠":"LLY Eli Lilly,JNJ J&J,PFE Pfizer,MRK Merck,ABBV AbbVie","生技新藥":"AMGN Amgen,GILD Gilead,VRTX Vertex,REGN Regeneron,MRNA Moderna"},
"運輸":{"航空":"DAL Delta,UAL United,AAL American,LUV Southwest","物流鐵路":"UPS UPS,FDX FedEx,UNP Union Pacific,CSX CSX"},
"零售百貨":{"零售":"WMT Walmart,COST Costco,TGT Target,HD Home Depot,AMZN Amazon"},
"金融":{"銀行支付":"JPM JPMorgan,BAC BofA,GS Goldman,MS Morgan Stanley,V Visa"}}};
const $=id=>document.getElementById(id);
let mkt='TW',ind='',q='',liveOn=true,fav=[];
try{fav=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const S={};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hs(s){let h=7;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function mk(m,code,name,i,sub){const r=rng(hs(code)),us=m=='US';let p=us?30+r()*400:15+r()*500,k=[],tr=(r()-.45)*.004,bv=us?(2+r()*30)*1e6:500+r()*40000;const d=new Date();
 for(let n=0;n<130;n++){const o=p,ret=tr+(r()-.5)*.035,c=o*(1+ret),h=Math.max(o,c)*(1+r()*.01),l=Math.min(o,c)*(1-r()*.01);p=c;
  const dt=new Date(d-(129-n)*864e5*1.45);k.push({o,h,l,c,v:bv*(.6+r()*.8)*(1+Math.abs(ret)*18),t:dt.toISOString().slice(5,10)})}
 const s={m,code,name,i,sub,k,r:hs(code)};S[m+code]=s;return s}
const TREE={TW:{},US:{}};
for(const m in RAW)for(const i in RAW[m]){TREE[m][i]={};for(const sub in RAW[m][i]){TREE[m][i][sub]=RAW[m][i][sub].split(',').map(x=>{const j=x.indexOf(' ');return mk(m,x.slice(0,j),x.slice(j+1),i,sub)})}}
const ma=(k,n,i)=>i<n-1?null:k.slice(i-n+1,i+1).reduce((a,b)=>a+b.c,0)/n;
function ind_(s){const k=s.k,n=k.length-1,c=k[n].c;s.p=c;s.pv=k[n-1].c;s.chg=(c/s.pv-1)*100;
 s.m5=ma(k,5,n);s.m20=ma(k,20,n);s.m60=ma(k,60,n);
 const av=k.slice(n-20,n).reduce((a,b)=>a+b.v,0)/20;s.vr=k[n].v/av;
 let g=0,l=0;for(let i=n-13;i<=n;i++){const d=k[i].c-k[i-1].c;d>0?g+=d:l-=d}s.rsi=100-100/(1+g/(l||1e-9));
 const w=k.slice(n-8),hh=Math.max(...w.map(x=>x.h)),ll=Math.min(...w.map(x=>x.l));s.kd=(c-ll)/(hh-ll||1)*100;
 s.bull=c>s.m5&&s.m5>s.m20&&s.m20>s.m60;
 s.score=Math.min(s.vr,3)*30+Math.min(Math.abs(s.chg),10)*4+(c>s.m5?10:0)+(c>s.m20?10:0)+(s.m5>s.m20?10:0)+(s.bull?10:0);
 s.tags=[];if(s.vr>1.5)s.tags.push('爆量');if(s.chg>3)s.tags.push('強漲');if(s.chg<-3)s.tags.push('急跌');if(s.bull)s.tags.push('多頭排列');if(s.rsi>70)s.tags.push('RSI過熱');if(s.rsi<30)s.tags.push('RSI超賣')}
const all=()=>Object.values(S);
function recalc(){all().forEach(ind_)}recalc();
const cls=(s,v)=>(s.m=='TW'?v>=0:v<0)?'up':'dn';
const col=(m,up)=>(m=='TW')==up?'#e5484d':'#2fa36b';
const f2=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const fv=s=>{const v=s.k[s.k.length-1].v;return s.m=='TW'?Math.round(v).toLocaleString()+' 張':(v/1e6).toFixed(1)+'M 股'};
function row(s,i){const st=fav.includes(s.m+s.code);return `<tr class="r" data-k="${s.m+s.code}"><td><span class="star ${st?'on':''}" data-f="${s.m+s.code}">${st?'★':'☆'}</span>${i?i+'. ':''}${s.code} ${s.name}${s.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</td><td class="${cls(s,s.chg)}">${f2(s.p)}</td><td class="${cls(s,s.chg)}">${s.chg>=0?'▲':'▼'} ${Math.abs(s.chg).toFixed(2)}%</td><td>${fv(s)}</td><td>${Math.round(s.score)}</td></tr>`}
const th='<div class="tw"><table><tr><th>股票</th><th>現價</th><th>漲跌幅</th><th>成交量</th><th>熱度</th></tr>';
function render(){const m=$('main'),T=TREE[mkt];
 $('inds').innerHTML=['🔥 全市場熱門','⭐ 自選',...Object.keys(T)].map(x=>`<button class="chip ${x==ind?'on':''}" data-i="${x}">${x}</button>`).join('');
 let h='';
 if(q){const r=all().filter(s=>s.m==mkt&&(s.code+s.name).toLowerCase().includes(q.toLowerCase()));h=`<div class="sec"><h2>搜尋結果（${r.length}）</h2>${th}${r.map(s=>row(s)).join('')}</table></div></div>`}
 else if(ind=='🔥 全市場熱門'){const r=all().filter(s=>s.m==mkt).sort((a,b)=>b.score-a.score).slice(0,10);h=`<div class="sec"><h2>${mkt=='TW'?'台股':'美股'}全市場熱門 Top 10</h2>${th}${r.map((s,i)=>row(s,i+1)).join('')}</table></div></div>`}
 else if(ind=='⭐ 自選'){const r=all().filter(s=>fav.includes(s.m+s.code));h=`<div class="sec"><h2>自選股（${r.length}）</h2>${r.length?th+r.map(s=>row(s)).join('')+'</table></div>':'<p style="padding:12px;color:var(--mu)">點股票左側的 ☆ 加入自選</p>'}</div>`}
 else for(const sub in T[ind]){const r=[...T[ind][sub]].sort((a,b)=>b.score-a.score).slice(0,10);h+=`<div class="sec"><h2>${ind} › ${sub}　<small style="color:var(--mu)">Top ${r.length}</small></h2>${th}${r.map((s,i)=>row(s,i+1)).join('')}</table></div></div>`}
 m.innerHTML=h}
function news(s){const a=['法人上修目標價，看好後市接單動能','外資買超，股價量能放大','公布最新月營收，年增表現受市場關注','宣布擴產計畫，產能預計逐步開出','產業供應鏈傳出新訂單消息'];const r=rng(s.r+new Date().getDate());
 return [0,1,2,3].map(i=>`<div class="news">${s.name}${a[Math.floor(r()*a.length)]}<br><small>${String(8+i*2).padStart(2,'0')}:${String(Math.floor(r()*59)).padStart(2,'0')} ・ 示範範例標題</small></div>`).join('')}
function detail(key,range=90,tab=0){const s=S[key];if(!s)return;const r=rng(s.r+9),us=s.m=='US',d=new Date(),ex=new Date(+d+(10+Math.floor(r()*60))*864e5),pay=new Date(+ex+25*864e5),cash=us?(.2+r()*1.2):(.5+r()*6);
 const hi=Math.max(...s.k.map(x=>x.h)),lo=Math.min(...s.k.map(x=>x.l));
 const sig=[s.p>s.m5?'站上5日線':'跌破5日線',s.p>s.m20?'站上月線':'跌破月線',s.p>s.m60?'站上季線':'跌破季線',s.rsi>70?'RSI 過熱':s.rsi<30?'RSI 超賣':'RSI 中性',s.kd>80?'KD 高檔':s.kd<20?'KD 低檔':'KD 中性'];
 $('md').innerHTML=`<div class="row" style="justify-content:space-between"><div><b style="font-size:18px">${s.code} ${s.name}</b><br><span class="tag" style="margin:0">${us?'美股':'台股'} ・ ${s.i} › ${s.sub}</span></div><button class="chip" id="cl">✕ 關閉</button></div>
 <div style="font-size:26px;margin:6px 0" class="${cls(s,s.chg)}">${f2(s.p)} <small>${s.chg>=0?'▲':'▼'} ${Math.abs(s.chg).toFixed(2)}%</small></div>
 <div class="row" style="margin-bottom:8px">${['技術分析','公司資訊 / 除權息','今日新聞'].map((t,i)=>`<button class="chip ${i==tab?'on':''}" data-t="${i}">${t}</button>`).join('')}</div>
 ${tab==0?`<div class="row" style="margin-bottom:6px">${[30,60,90,130].map(n=>`<button class="chip ${n==range?'on':''}" data-r="${n}">${n}日</button>`).join('')}<small style="color:var(--mu)"><span style="color:#f5a623">━</span> 5日 <span style="color:#4a90e2">━</span> 月線(20) <span style="color:#a855f7">━</span> 季線(60)</small></div><canvas id="cv"></canvas>
 <div class="kv" style="margin-top:8px"><div><b>5日線</b>${f2(s.m5)}</div><div><b>月線 (20)</b>${f2(s.m20)}</div><div><b>季線 (60)</b>${f2(s.m60)}</div><div><b>RSI(14)</b>${s.rsi.toFixed(1)}</div><div><b>KD 值(9)</b>${s.kd.toFixed(1)}</div><div><b>量比(對20日均量)</b>${s.vr.toFixed(2)}x</div></div>
 <p><b>訊號：</b>${sig.join('、')}${s.bull?'、<b>多頭排列</b>':''}</p>`
 :tab==1&&DET[key]?infoHtml(s,key):tab==1?`<div class="kv"><div><b>產業</b>${s.i} / ${s.sub}</div><div><b>市值（示範）</b>${(us?(50+r()*3000).toFixed(0)+' 億美元':(300+r()*30000).toFixed(0)+' 億元')}</div><div><b>本益比</b>${(8+r()*30).toFixed(1)}</div><div><b>EPS（近四季）</b>${(s.p/(8+r()*30)).toFixed(2)}</div><div><b>${130}日最高</b>${f2(hi)}</div><div><b>${130}日最低</b>${f2(lo)}</div></div>
 <h3>除權息（示範）</h3><div class="kv"><div><b>${us?'每季現金股利':'現金股利'}</b>${cash.toFixed(2)}</div><div><b>${us?'':'股票股利'}</b>${us?'—':(r()>.8?'0.5':'0')}</div><div><b>除息日</b>${ex.toISOString().slice(0,10)}</div><div><b>發放日</b>${pay.toISOString().slice(0,10)}</div><div><b>殖利率</b>${(cash*(us?4:1)/s.p*100).toFixed(2)}%</div></div>`
 :newsHtml(s,key)}`;
 $('ov').style.display='block';
 if(tab==0)draw(s,range);
 $('md').onclick=e=>{const t=e.target;if(t.id=='cl')$('ov').style.display='none';else if(t.dataset.t)detail(key,range,+t.dataset.t);else if(t.dataset.r)detail(key,+t.dataset.r,0)};cur=[key,range,tab]}
let cur=null;
function draw(s,range){const cv=$('cv'),dp=devicePixelRatio||1,W=cv.clientWidth,H=340;cv.width=W*dp;cv.height=H*dp;const c=cv.getContext('2d');c.scale(dp,dp);
 const k=s.k,N=k.length,st=N-range,D=k.slice(st),PH=250,pr=46,bw=(W-pr)/D.length;
 const hi=Math.max(...D.map(x=>x.h)),lo=Math.min(...D.map(x=>x.l)),mv=Math.max(...D.map(x=>x.v));
 const Y=v=>10+(hi-v)/(hi-lo||1)*(PH-20),X=i=>i*bw+bw/2;
 const css=getComputedStyle(document.documentElement);c.strokeStyle=css.getPropertyValue('--bd');c.fillStyle=css.getPropertyValue('--mu');c.font='11px sans-serif';c.textAlign='left';
 for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,y=Y(v);c.beginPath();c.moveTo(0,y);c.lineTo(W-pr,y);c.stroke();c.fillText(v.toFixed(1),W-pr+4,y+4)}
 D.forEach((x,i)=>{const u=x.c>=x.o,cl=col(s.m,u);c.strokeStyle=c.fillStyle=cl;c.beginPath();c.moveTo(X(i),Y(x.h));c.lineTo(X(i),Y(x.l));c.stroke();
  const y1=Y(Math.max(x.o,x.c)),hh=Math.max(1,Math.abs(Y(x.o)-Y(x.c)));c.fillRect(X(i)-bw*.35,y1,bw*.7,hh);
  const vh=x.v/mv*60;c.globalAlpha=.55;c.fillRect(X(i)-bw*.35,H-vh-14,bw*.7,vh);c.globalAlpha=1;
  if(i%Math.ceil(D.length/6)==0){c.fillStyle=css.getPropertyValue('--mu');c.fillText(x.t,X(i)-12,H-2)}});
 [[5,'#f5a623'],[20,'#4a90e2'],[60,'#a855f7']].forEach(([n,cl])=>{c.strokeStyle=cl;c.lineWidth=1.4;c.beginPath();let on=0;for(let i=0;i<D.length;i++){const m=ma(k,n,st+i);if(m==null)continue;on?c.lineTo(X(i),Y(m)):c.moveTo(X(i),Y(m));on=1}c.stroke()});c.lineWidth=1}
// events
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.f){const k=t.dataset.f;fav=fav.includes(k)?fav.filter(x=>x!=k):[...fav,k];try{localStorage.setItem('fav',JSON.stringify(fav))}catch(x){}render();e.stopPropagation();return}
 if(t.dataset.i){ind=t.dataset.i;q='';$('q').value='';render();return}
 const tr=t.closest&&t.closest('tr.r');if(tr&&!$('ov').contains(t))detail(tr.dataset.k)});
$('ov').addEventListener('click',e=>{if(e.target.id=='ov')$('ov').style.display='none'});
function setM(m){mkt=m;ind='🔥 全市場熱門';$('mTW').classList.toggle('on',m=='TW');$('mUS').classList.toggle('on',m=='US');render()}
$('mTW').onclick=()=>setM('TW');$('mUS').onclick=()=>setM('US');
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('live').onclick=()=>{liveOn=!liveOn;$('live').classList.toggle('on',liveOn);$('live').textContent=(liveOn?'● ':'○ ')+'即時更新'};
// 替換成真實 API：回傳 {代號:{price,volume}} 後更新 S[m+code].k 最後一根
// 資料放在 repo 的 data 分支，經 raw.githubusercontent.com 讀取（支援跨網域，不需重新部署網站）
// 自動由 xxx.github.io/repo/ 推算；自訂網域或推算錯誤時，把下一行改成 'https://raw.githubusercontent.com/帳號/repo名稱/data/'
const DATA_URL_OVERRIDE='';
const DATA_URL=DATA_URL_OVERRIDE||(()=>{const h=location.hostname,p=location.pathname.split('/')[1];
 if(h.endsWith('.github.io')){const o=h.split('.')[0];return 'https://raw.githubusercontent.com/'+o+'/'+(p&&!p.includes('.')?p:o+'.github.io')+'/data/'}
 return 'data/'})();
let real=false,tk=0,DET={},NEWS={},DET_AT='',NEWS_AT='';
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=(v,us)=>v?(v>=1e12?(v/1e12).toFixed(2)+' 兆':(v/1e8).toFixed(0)+' 億')+(us?' 美元':' 元'):'—';
const nz=(v,d=2)=>v==null?'—':Number(v).toFixed(d);
function infoHtml(s,key){const D=DET[key],I=D.info||{},us=s.m=='US',dv=D.div||[];
 return `<div class="kv"><div><b>產業</b>${esc(I.sector||s.i)}${I.industry?' / '+esc(I.industry):''}</div><div><b>市值</b>${cap(I.cap,us)}</div><div><b>本益比</b>${nz(I.pe,1)}</div><div><b>EPS</b>${nz(I.eps)}</div><div><b>52週高 / 低</b>${nz(I.hi)} / ${nz(I.lo)}</div><div><b>員工數</b>${I.emp?Number(I.emp).toLocaleString():'—'}</div></div>
 ${I.sum?`<p style="color:var(--mu)">${esc(I.sum)}${/^https?:/.test(I.web||'')?` <a href="${esc(I.web)}" target="_blank" rel="noopener">官網</a>`:''}</p>`:''}
 <h3>除息資料</h3><div class="kv"><div><b>近12個月現金股利</b>${D.ttm?nz(D.ttm,3):'—'}</div><div><b>殖利率（近12個月）</b>${D.ttm?(D.ttm/s.p*100).toFixed(2)+'%':'—'}</div></div>
 ${dv.length?`<div class="tw"><table style="min-width:0"><tr><th>除息日</th><th>現金股利</th></tr>${dv.map(x=>`<tr><td>${esc(x[0])}</td><td>${nz(x[1],3)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mu)">查無股利紀錄</p>'}
 <small style="color:var(--mu)">來源 Yahoo Finance，僅含現金股利；股票股利與未來除權息日請以公司公告為準。公司簡介為原文（英文）。更新：${esc(DET_AT)}</small>`}
function newsHtml(s,key){const a=NEWS[key];if(!a||!a.length)return news(s);const now=Date.now()/1000;
 return a.map(n=>`<div class="news">${/^https:/.test(n.u)?`<a href="${esc(n.u)}" target="_blank" rel="noopener" style="color:inherit">${esc(n.t)}</a>`:esc(n.t)}<br><small>${n.ts>now-86400?'<b style="color:var(--ac)">今日</b> ・ ':''}${esc(n.s)} ・ ${esc(n.d)}（台北時間）</small></div>`).join('')+`<small style="color:var(--mu)">來源：Google 新聞，更新 ${esc(NEWS_AT)}。若近兩日沒有新聞，會顯示近 7 天。</small>`}
async function loadExtras(){let ok=0;
 try{const d=await getJSON('details.json');DET=d.data;DET_AT=d.updated;ok++}catch(e){console.warn('details.json',e)}
 try{const d=await getJSON('news.json');NEWS=d.data;NEWS_AT=d.updated;ok++}catch(e){console.warn('news.json',e)}
 $('note').innerHTML+=ok?'公司資訊、除息資料來自 Yahoo Finance，新聞來自 Google 新聞（每日更新；缺資料的個股顯示示範內容）。':'除權息、公司資訊、新聞為示範資料。'}
async function getJSON(f){const r=await fetch(DATA_URL+f+'?t='+Math.floor(Date.now()/6e4));if(!r.ok)throw new Error(f+' '+r.status);return r.json()}
async function loadHistory(){try{const h=await getJSON('history.json');let n=0;
 for(const key in h.data){const s=S[key],a=h.data[key];if(!s||!a.length)continue;s.k=a.map(x=>({t:x[0],o:x[1],h:x[2],l:x[3],c:x[4],v:x[5]}));n++}
 real=n>0;recalc();render();
 $('note').innerHTML='資料來源：Yahoo Finance，由 GitHub Actions 定時抓取（可能有延遲）。K 線更新：'+h.updated+'。';loadExtras()}
 catch(e){console.warn('無法載入 history.json，維持示範資料',e)}}
async function loadQuotes(){try{const q=await getJSON('live.json');
 for(const key in q.data){const s=S[key],x=q.data[key];if(!s)continue;let l=s.k[s.k.length-1];
  if(l.t!==x.t){s.k.push({t:x.t,o:x.o,h:x.h,l:x.l,c:x.p,v:x.v});if(s.k.length>135)s.k.shift()}
  else{l.c=x.p;l.h=Math.max(l.h,x.h);l.l=Math.min(l.l,x.l);l.v=x.v}}}catch(e){console.warn('live.json 載入失敗',e)}}
function demoTick(){all().forEach(s=>{const l=s.k[s.k.length-1];if(Math.random()<.5){l.c*=1+(Math.random()-.5)*.004;l.h=Math.max(l.h,l.c);l.l=Math.min(l.l,l.c);l.v*=1+Math.random()*.003}})}
setInterval(async()=>{if(!liveOn)return;tk++;
 if(real){if(tk%20)return;await loadQuotes()}else demoTick();
 recalc();if($('ov').style.display!='block')render();else if(real&&cur&&cur[2]==0)detail(cur[0],cur[1],0)},3000);
ind='🔥 全市場熱門';render();loadHistory();
</script></body></html>
