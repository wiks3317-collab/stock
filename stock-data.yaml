name: stock-data
on:
  schedule:
    - cron: "*/10 0-5 * * 1-5"    # 台股盤中（UTC 0-5 = 台北 8-13）
    - cron: "*/10 13-21 * * 1-5"  # 美股盤中
    - cron: "30 10 * * 1-5"       # 台股收盤後更新 K 線
    - cron: "30 22 * * 1-5"       # 美股收盤後更新 K 線
  workflow_dispatch:
    inputs:
      mode:
        description: "history 或 live"
        default: "history"
permissions:
  contents: write
concurrency: stock-data
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 決定模式
        run: |
          S="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.mode }}"
          elif [ "$S" = "30 10 * * 1-5" ] || [ "$S" = "30 22 * * 1-5" ]; then M=history
          else M=live; fi
          echo "MODE=$M" >> "$GITHUB_ENV"
      - run: python fetch_data.py "$MODE"
      - name: 提交資料
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $MODE" && git pull --rebase && git push)
