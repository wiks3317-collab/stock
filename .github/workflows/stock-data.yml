name: stock-data
on:
  schedule:
    # 即時價量（live）以 cron-job.org 呼叫 workflow_dispatch 每 5 分鐘準時觸發為主；
    # 下面兩行是備援（cron-job.org 或 token 失效時仍會更新），錯開整點避免跟主要觸發重複。
    - cron: "2-59/15 1-5 * * 1-5"    # 台股盤中（UTC 1-5 = 台北 9-13）→ 即時價量（備援）
    - cron: "2-59/15 13-22 * * 1-5"  # 覆蓋美股夏/冬令時間 → 即時價量（備援）
    - cron: "30 7 * * 1-5"        # 台股收盤後較早更新全市場名單與當日行情（台北 15:30）
    - cron: "30 10 * * 1-5"       # 台股收盤後 → K 線 + 股利 + 新聞
    - cron: "30 22 * * 1-5"       # 美股收盤後 → K 線 + 股利 + 新聞
  workflow_dispatch:
    inputs:
      mode:
        description: "live / history / daily / universe"
        default: "daily"
permissions:
  contents: write
concurrency: stock-data
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 取得既有的 data 分支（第一次執行時不存在，會略過）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: pub
      - run: mkdir -p pub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # 快取套件，每次執行少花約 20~40 秒
      - run: pip install -r requirements.txt
      - name: 決定模式
        run: |
          S="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.mode }}"
          elif [ "$S" = "30 7 * * 1-5" ]; then M=universe
          elif [ "$S" = "30 10 * * 1-5" ] || [ "$S" = "30 22 * * 1-5" ]; then M=daily
          else M=live; fi
          echo "MODE=$M" >> "$GITHUB_ENV"
      - run: python fetch_data.py "$MODE"
        env:
          OUT_DIR: pub
          TW_TOP: "20"   # live.json 涵蓋的額外名單：台股每個產業前 20 檔（畫面每區只顯示前 10，多留餘裕）
          US_TOP: "10"   # 美股每個 GICS 子產業前 10 檔（等於幾乎涵蓋 S&P500 + Nasdaq100）
      - name: 發佈到 data 分支（每次覆蓋，只保留 1 個 commit）
        run: |
          cd pub
          rm -rf .git
          git init -q -b data
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data ${MODE} $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
